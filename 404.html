<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — VidRift</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Manrope:wght@500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--paper:#f2f1ed;--ink-2:#b9b6b0;--ink-3:#77747a;--brand:#E50914}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--paper);font:500 15px/1.6 'Manrope',ui-sans-serif,sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px;-webkit-font-smoothing:antialiased}
main{max-width:46ch}
.lab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.03em;line-height:1.05;margin:14px 0 12px}
h1 em{font-style:normal;color:var(--brand)}
p{color:var(--ink-2)}
a{display:inline-flex;align-items:center;margin-top:22px;height:38px;padding:0 16px;border-radius:6px;background:var(--paper);color:var(--bg);text-decoration:none;font-weight:700;font-size:13.5px}
a:hover{background:#fff}
</style>
</head>
<body>
<main>
  <span class="lab">Error 404</span>
  <h1>No such page<em>.</em></h1>
  <p>The embed API is still running. This URL just isn't part of it.</p>
  <a href="/">Back to vidrift</a>
</main>
</body>
</html>
